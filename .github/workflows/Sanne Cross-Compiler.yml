name: Sanne Cross-Platform Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_DIR: app
  DETAILS_FILE: app/details.san
  DEFAULT_APP_NAME: "SanneWebApp"
  DEFAULT_PACKAGE_NAME: "com.sanne.webApp"
  DEFAULT_LOGO: "https://picsum.photos/512"
  DEFAULT_VERSION: "1.0.0"

# 🔧 Shared step: install dependencies safely
defaults:
  run:
    shell: bash

jobs:

  # 🐧 ANDROID BUILD
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd $APP_DIR
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Parse app details
        run: |
          APP_NAME=$(grep '^appName=' $DETAILS_FILE | cut -d'=' -f2 || echo "$DEFAULT_APP_NAME")
          PACKAGE_NAME=$(grep '^packageName=' $DETAILS_FILE | cut -d'=' -f2 || echo "$DEFAULT_PACKAGE_NAME")
          LOGO=$(grep '^logo=' $DETAILS_FILE | cut -d'=' -f2 || echo "$DEFAULT_LOGO")

          cd $APP_DIR
          mkdir -p resources
          LOGO=$(grep '^logo=' $DETAILS_FILE | cut -d'=' -f2)
          if [[ "$LOGO" == http* ]]; then
          echo "Downloading logo from URL"
          curl -L "$LOGO" -o logo.png
          elif [ -f "$LOGO" ]; then
          echo "Using local logo file"
          cp "$LOGO" logo.png
          else
              echo "Using default logo"
              curl -L "https://via.placeholder.com/512" -o logo.png
          fi

          npx cap init "$APP_NAME" "$PACKAGE_NAME" || true
          npx cap add android || true
          npx cap sync

      - name: Build APK
        run: |
          cd $APP_DIR/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: $APP_DIR/android/app/build/outputs/apk/debug/app-debug.apk


  # 🍎 iOS BUILD
  ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd $APP_DIR
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Setup Capacitor iOS
        run: |
          cd $APP_DIR
          npx cap add ios || true
          npx cap sync

      - name: Build iOS
        run: |
          cd $APP_DIR/ios/App
          xcodebuild -scheme App -configuration Release build

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: $APP_DIR/ios/build/**


  # 🪟 WINDOWS BUILD
  windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd $env:APP_DIR
          if (Test-Path package-lock.json) { npm ci } else { npm install }

      - name: Setup Electron
        run: |
          cd $env:APP_DIR
          npm install --save-dev electron electron-builder

          if (!(Test-Path main.js)) {
            @"
            const { app, BrowserWindow } = require('electron');
            const path = require('path');
            function createWindow() {
              const win = new BrowserWindow({
                width: 800,
                height: 600,
                icon: path.join(__dirname, 'resources/logo.png'),
                webPreferences: { nodeIntegration: true }
              });
              win.loadFile('index.html');
            }
            app.whenReady().then(createWindow);
            "@ | Out-File main.js
          }

      - name: Build Windows App
        run: |
          cd $env:APP_DIR
          npx electron-builder --win

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: $env:APP_DIR/dist/*.exe


  # 🐧 LINUX BUILD
  linux:
    name: Build Linux App
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd $APP_DIR
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Setup Electron
        run: |
          cd $APP_DIR
          npm install --save-dev electron electron-builder

      - name: Build Linux App
        run: |
          cd $APP_DIR
          npx electron-builder --linux

      - name: Upload Linux App
        uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: $APP_DIR/dist/*.AppImage


  # 🍎 MAC DESKTOP BUILD
  mac:
    name: Build macOS App
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd $APP_DIR
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Setup Electron
        run: |
          cd $APP_DIR
          npm install --save-dev electron electron-builder

      - name: Build macOS App
        run: |
          cd $APP_DIR
          npx electron-builder --mac

      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: $APP_DIR/dist/*.dmg
