name: Sanne Android Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_DIR: app
  DETAILS_FILE: app/details.san
  DEFAULT_APP_NAME: "SanneWebApp"
  DEFAULT_PACKAGE_NAME: "com.sanne.webapp"
  DEFAULT_LOGO: "https://picsum.photos/512"

defaults:
  run:
    shell: bash

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ☕ Java 17 (required for latest Android Gradle)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 📱 Android SDK
      - uses: android-actions/setup-android@v4

      # 🔍 Parse details.san safely
      - name: Parse App Details
        run: |
          get_val() {
            [ -f "$DETAILS_FILE" ] && grep "^$1=" "$DETAILS_FILE" | cut -d'=' -f2 | head -n1
          }

          APP_NAME=$(get_val appName)
          PACKAGE_NAME=$(get_val packageName)
          LOGO=$(get_val logo)

          [ -z "$APP_NAME" ] && APP_NAME="$DEFAULT_APP_NAME"
          [ -z "$PACKAGE_NAME" ] && PACKAGE_NAME="$DEFAULT_PACKAGE_NAME"
          [ -z "$LOGO" ] && LOGO="$DEFAULT_LOGO"

          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "LOGO=$LOGO" >> $GITHUB_ENV

          PACKAGE_PATH=$(echo $PACKAGE_NAME | tr '.' '/')
          echo "PACKAGE_PATH=$PACKAGE_PATH" >> $GITHUB_ENV

      # 📦 Copy app files
      - name: Copy App
        run: |
          mkdir build_app
          rsync -av --exclude='details.san' $APP_DIR/ build_app/

      # 🎨 Prepare logo (FFmpeg conversion + densities)
      - name: Prepare Logo
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick

          mkdir -p android/app/src/main/res

          # Download or copy logo
          if [[ "$LOGO" =~ ^https?:// ]]; then
            curl -L "$LOGO" -o icon.tmp
          elif [ -f "$APP_DIR/$LOGO" ]; then
            cp "$APP_DIR/$LOGO" icon.tmp
          else
            curl -L "$DEFAULT_LOGO" -o icon.tmp
          fi

          # Convert to PNG if not already valid PNG
          ffmpeg -y -i icon.tmp icon.png || convert icon.tmp -background none -flatten icon.png

          # Generate all densities
          declare -A sizes=( ["mdpi"]=48 ["hdpi"]=72 ["xhdpi"]=96 ["xxhdpi"]=144 ["xxxhdpi"]=192 )
          for density in "${!sizes[@]}"; do
            mkdir -p android/app/src/main/res/mipmap-$density
            convert icon.png -resize ${sizes[$density]}x${sizes[$density]} \
              android/app/src/main/res/mipmap-$density/ic_launcher.png
          done

      # 🏗 Create project structure
      - name: Create Android Project
        run: |
          mkdir -p android/app/src/main/java/$PACKAGE_PATH
          mkdir -p android/app/src/main/assets

          cp -r build_app/* android/app/src/main/assets/

      # 🧠 MainActivity
      - name: Create MainActivity
        run: |
          cat > android/app/src/main/java/$PACKAGE_PATH/MainActivity.java << EOF
          package $PACKAGE_NAME;

          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.app.Activity;

          public class MainActivity extends Activity {
              WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      # ⚙️ Gradle + Android config
      - name: Android Config
        run: |
          mkdir -p android

          # gradle.properties
          cat > android/gradle.properties << EOF
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # settings.gradle
          cat > android/settings.gradle << EOF
          rootProject.name = "$APP_NAME"
          include ':app'
          EOF

          # root build.gradle
          cat > android/build.gradle << 'EOF'
          buildscript {
            repositories {
              google()
              mavenCentral()
            }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.4.0'
            }
          }

          allprojects {
            repositories {
              google()
              mavenCentral()
            }
          }
          EOF

          # app build.gradle (with Kotlin conflict fix)
          cat > android/app/build.gradle << EOF
          plugins {
            id 'com.android.application'
          }

          android {
            namespace "$PACKAGE_NAME"
            compileSdk 35

            defaultConfig {
              applicationId "$PACKAGE_NAME"
              minSdk 21
              targetSdk 35
              versionCode 1
              versionName "1.0"
            }

            buildTypes {
              release {
                minifyEnabled false
              }
            }
          }

          dependencies {
            implementation 'androidx.appcompat:appcompat:1.7.0'
          }

          // ✅ Force Kotlin stdlib versions to avoid duplicate classes
          configurations.all {
              resolutionStrategy {
                  force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                  force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
                  force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
              }
          }
          EOF

      # 📄 Manifest
      - name: Manifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml << EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="$PACKAGE_NAME">

            <uses-permission android:name="android.permission.INTERNET"/>

            <application
                android:label="$APP_NAME"
                android:icon="@mipmap/ic_launcher">

              <activity android:name=".MainActivity"
                        android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>

            </application>
          </manifest>
          EOF

      # 🔨 Build APK
      - name: Build APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.6
          ./gradlew assembleRelease

      # 🔐 Sign APK
      - name: Sign APK
        run: |
          keytool -genkey -v -keystore keystore.jks \
          -alias sanne -storepass password -keypass password \
          -keyalg RSA -validity 10000 \
          -dname "CN=$APP_NAME"

          APK=$(find android -name "*release*.apk" | head -n1)

          $ANDROID_HOME/build-tools/*/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias sanne \
            --ks-pass pass:password \
            --key-pass pass:password \
            --out signed.apk \
            "$APK"

      # 📦 Upload
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: signed.apk
