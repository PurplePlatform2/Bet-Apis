name: Sanne Cross-Platform Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_DIR: app
  DETAILS_FILE: app/details.san
  DEFAULT_APP_NAME: "SanneWebApp"
  DEFAULT_PACKAGE_NAME: "com.sanne.webapp"
  DEFAULT_LOGO: "https://picsum.photos/512"
  DEFAULT_VERSION: "1.0.0"

defaults:
  run:
    shell: bash

jobs:

# ================= ANDROID =================
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # 🔍 Parse details.san
      - name: Parse App Details
        run: |
          get_val() {
            grep "^$1=" $DETAILS_FILE | cut -d'=' -f2 | head -n1
          }

          APP_NAME=$(get_val appName)
          PACKAGE_NAME=$(get_val packageName)
          LOGO=$(get_val logo)

          [ -z "$APP_NAME" ] && APP_NAME=$DEFAULT_APP_NAME
          [ -z "$PACKAGE_NAME" ] && PACKAGE_NAME=$DEFAULT_PACKAGE_NAME
          [ -z "$LOGO" ] && LOGO=$DEFAULT_LOGO

          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "LOGO=$LOGO" >> $GITHUB_ENV

          # convert package → folder path
          PACKAGE_PATH=$(echo $PACKAGE_NAME | tr '.' '/')
          echo "PACKAGE_PATH=$PACKAGE_PATH" >> $GITHUB_ENV

      # 📦 Copy app files
      - name: Copy App
        run: |
          mkdir build_app
          rsync -av --exclude='details.san' $APP_DIR/ build_app/

      # 🎨 Prepare logo
      - name: Prepare Logo
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          if [[ "$LOGO" == http* ]]; then
            curl -L "$LOGO" -o icon.png
          elif [ -f "$APP_DIR/$LOGO" ]; then
            cp "$APP_DIR/$LOGO" icon.png
          else
            curl -L "$DEFAULT_LOGO" -o icon.png
          fi

          cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      # 🏗 Create Android project
      - name: Create Android Project
        run: |
          mkdir -p android/app/src/main/java/$PACKAGE_PATH
          mkdir -p android/app/src/main/assets

          cp -r build_app/* android/app/src/main/assets/

      # 🧠 MainActivity
      - name: Create MainActivity
        run: |
          cat > android/app/src/main/java/$PACKAGE_PATH/MainActivity.java << EOF
          package $PACKAGE_NAME;

          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.app.Activity;

          public class MainActivity extends Activity {
              WebView webView;

              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      # ⚙️ Android config
      - name: Android Config
        run: |
          cat > android/settings.gradle << EOF
          rootProject.name = "$APP_NAME"
          include ':app'
          EOF

          cat > android/build.gradle << 'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > android/app/build.gradle << EOF
          plugins { id 'com.android.application' }

          android {
            namespace "$PACKAGE_NAME"
            compileSdk 34

            defaultConfig {
              applicationId "$PACKAGE_NAME"
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }

            buildTypes { release { minifyEnabled false } }
          }

          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

      - name: Manifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml << EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="$PACKAGE_NAME">

            <uses-permission android:name="android.permission.INTERNET"/>

            <application
                android:label="$APP_NAME"
                android:icon="@mipmap/ic_launcher">

              <activity android:name=".MainActivity">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>

            </application>
          </manifest>
          EOF

      # 🔨 Build
      - name: Build APK
        run: |
          cd android
          gradle wrapper
          ./gradlew assembleRelease

      # 🔐 Sign
      - name: Sign APK
        run: |
          keytool -genkey -v -keystore keystore.jks \
          -alias sanne -storepass password -keypass password \
          -keyalg RSA -validity 10000 \
          -dname "CN=$APP_NAME"

          APK=$(find android -name "*release*.apk" | head -n1)

          $ANDROID_HOME/build-tools/*/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias sanne \
            --ks-pass pass:password \
            --key-pass pass:password \
            --out signed.apk \
            "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: signed.apk


# ================= iOS =================
  ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Parse Details
        run: |
          APP_NAME=$(grep '^appName=' $DETAILS_FILE | cut -d'=' -f2)
          [ -z "$APP_NAME" ] && APP_NAME=$DEFAULT_APP_NAME
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV

      - name: Copy App
        run: |
          mkdir ios_app
          rsync -av --exclude='details.san' $APP_DIR/ ios_app/

      - name: Create WKWebView App
        run: |
          mkdir -p ios/App

          cat > ios/App/ViewController.swift << EOF
          import UIKit
          import WebKit

          class ViewController: UIViewController {
              var webView: WKWebView!

              override func viewDidLoad() {
                  super.viewDidLoad()

                  webView = WKWebView(frame: self.view.frame)
                  self.view.addSubview(webView)

                  if let url = Bundle.main.url(forResource: "index", withExtension: "html") {
                      webView.loadFileURL(url, allowingReadAccessTo: url)
                  }
              }
          }
          EOF

      - name: Build iOS
        run: |
          xcodebuild -scheme App -configuration Release build || true

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ios/


# ================= DESKTOP =================
  desktop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copy App
        run: |
          mkdir desktop
          rsync -av --exclude='details.san' $APP_DIR/ desktop/

      - name: Setup Electron
        run: |
          cd desktop
          npm init -y
          npm install electron electron-builder

          cat > main.js << EOF
          const { app, BrowserWindow } = require('electron');

          function createWindow() {
            const win = new BrowserWindow({
              width: 900,
              height: 700,
              title: "$APP_NAME"
            });
            win.loadFile('index.html');
          }

          app.whenReady().then(createWindow);
          EOF

      - name: Build Desktop
        run: |
          cd desktop
          npx electron-builder --linux --win --mac

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-builds
          path: desktop/dist/
