name: Sanne Cross-Platform Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_DIR: app
  DETAILS_FILE: app/details.san
  DEFAULT_APP_NAME: "SanneWebApp"
  DEFAULT_PACKAGE_NAME: "com.sanne.webapp"
  DEFAULT_LOGO: "https://picsum.photos/512"
  DEFAULT_VERSION: "1.0.0"

defaults:
  run:
    shell: bash

jobs:

  # 🐧 ANDROID BUILD (SIGNED)
  android:
    name: Build Android APK (Signed)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd $APP_DIR
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Parse app details safely
        run: |
          get_val() {
            grep "^$1=" $DETAILS_FILE | cut -d'=' -f2 | head -n1
          }

          APP_NAME=$(get_val appName)
          PACKAGE_NAME=$(get_val packageName)
          LOGO=$(get_val logo)

          [ -z "$APP_NAME" ] && APP_NAME=$DEFAULT_APP_NAME
          [ -z "$PACKAGE_NAME" ] && PACKAGE_NAME=$DEFAULT_PACKAGE_NAME
          [ -z "$LOGO" ] && LOGO=$DEFAULT_LOGO

          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "LOGO=$LOGO" >> $GITHUB_ENV

      - name: Prepare logo
        run: |
          cd $APP_DIR
          mkdir -p resources

          if [[ "$LOGO" == http* ]]; then
            curl -L "$LOGO" -o resources/logo.png
          elif [ -f "$LOGO" ]; then
            cp "$LOGO" resources/logo.png
          else
            curl -L "$DEFAULT_LOGO" -o resources/logo.png
          fi

      - name: Setup Capacitor
        run: |
          cd $APP_DIR
          npx cap init "$APP_NAME" "$PACKAGE_NAME" --web-dir=.
          npx cap add android || true
          npx cap sync

      - name: Build APK
        run: |
          cd $APP_DIR/android
          chmod +x gradlew
          ./gradlew assembleRelease

      # 🔐 Decode keystore
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      # 🔐 Sign APK
      - name: Sign APK (Sanne Karibo)
        run: |
          BUILD_APK=$(find $APP_DIR/android/app/build/outputs/apk/release -name "*.apk" | head -n1)

          $ANDROID_HOME/build-tools/*/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out signed.apk \
            "$BUILD_APK"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: sanne-karibo-signed-apk
          path: signed.apk


  # 🍎 iOS BUILD
  ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd $APP_DIR
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Setup Capacitor iOS
        run: |
          cd $APP_DIR
          npx cap add ios || true
          npx cap sync

      - name: Build iOS
        run: |
          cd $APP_DIR/ios/App
          xcodebuild -scheme App -configuration Release build

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: $APP_DIR/ios/build/**


  # 🪟 WINDOWS BUILD
  windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd $env:APP_DIR
          if (Test-Path package-lock.json) { npm ci } else { npm install }

      - name: Setup Electron
        run: |
          cd $env:APP_DIR
          npm install --save-dev electron electron-builder

      - name: Build Windows
        run: |
          cd $env:APP_DIR
          npx electron-builder --win

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: $env:APP_DIR/dist/*.exe


  # 🐧 LINUX BUILD
  linux:
    name: Build Linux App
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd $APP_DIR
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Setup Electron
        run: |
          cd $APP_DIR
          npm install --save-dev electron electron-builder

      - name: Build Linux
        run: |
          cd $APP_DIR
          npx electron-builder --linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: $APP_DIR/dist/*.AppImage


  # 🍎 MAC DESKTOP BUILD
  mac:
    name: Build macOS App
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd $APP_DIR
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Setup Electron
        run: |
          cd $APP_DIR
          npm install --save-dev electron electron-builder

      - name: Build macOS
        run: |
          cd $APP_DIR
          npx electron-builder --mac

      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: $APP_DIR/dist/*.dmg
